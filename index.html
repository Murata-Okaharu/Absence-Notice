<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>勤怠・連絡管理システム</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .modal {
      transition: opacity 0.25s ease;
    }
    body.modal-active {
      overflow-x: hidden;
      overflow-y: hidden !important;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

  <!-- ==================== ログイン画面 ==================== -->
  <div id="loginScreen" class="flex items-center justify-center min-h-screen px-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-full max-w-md border border-slate-200">
      <div class="text-center mb-8">
        <div class="inline-block p-4 bg-blue-50 rounded-full text-blue-600 mb-3">
          <i class="fa-solid fa-user-lock fa-2x"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-800" id="loginTitle">本人確認ログイン</h1>
        <p class="text-xs text-slate-500 mt-1" id="loginSub">従業員番号と生年月日を入力してください</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1" id="lblEmpId">従業員番号</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
              <i class="fa-solid fa-id-card"></i>
            </span>
            <input type="text" id="loginEmpId" required placeholder="例: 1001"
              class="w-full pl-10 pr-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1" id="lblDob">暗証番号 / 生年月日</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input type="password" id="loginDob" required placeholder="例: 19900101"
              class="w-full pl-10 pr-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          </div>
        </div>

        <div id="loginError" class="text-red-500 text-sm hidden bg-red-50 p-3 rounded-lg border border-red-200"></div>

        <button type="submit" id="btnLoginSubmit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-md hover:shadow-lg transition duration-200">
          ログイン
        </button>
      </form>
    </div>
  </div>


  <!-- ==================== メイン画面 ==================== -->
  <div id="mainApp" class="hidden min-h-screen flex flex-col">
    <!-- ヘッダー -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
      <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <i class="fa-solid fa-clipboard-user text-2xl text-blue-600"></i>
          <div>
            <h1 class="text-lg font-bold text-slate-800 leading-tight" id="appTitle">勤怠・連絡管理システム</h1>
            <div class="flex items-center text-xs text-slate-500 space-x-2">
              <span id="userInfo" class="font-medium text-slate-700"></span>
              <span id="adminBadge" class="hidden bg-amber-100 text-amber-800 px-2 py-0.5 rounded text-[10px] font-bold">管理者</span>
            </div>
          </div>
        </div>

        <div class="flex items-center space-x-3">
          <!-- 言語切替 -->
          <select id="langSelect" onchange="changeLanguage(this.value)" class="text-xs border border-slate-300 rounded-md p-1.5 bg-slate-50 text-slate-700 font-medium">
            <option value="ja">日本語</option>
            <option value="vi">Tiếng Việt</option>
            <option value="en">English</option>
          </select>

          <!-- ログアウト -->
          <button onclick="logout()" class="text-xs text-slate-500 hover:text-red-600 p-2 rounded-lg hover:bg-slate-100 transition" title="ログアウト">
            <i class="fa-solid fa-right-from-bracket text-base"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-grow max-w-6xl w-full mx-auto p-4 space-y-6">
      
      <!-- 有給残日数サマリーカード -->
      <div id="paidLeaveSummary" class="bg-gradient-to-r from-blue-500 to-indigo-600 rounded-xl p-5 text-white shadow-md flex justify-between items-center">
        <div>
          <p class="text-xs text-blue-100 font-medium" id="lblPaidLeaveTitle">本年度の有給休暇取得状況</p>
          <div class="flex items-baseline space-x-2 mt-1">
            <span class="text-3xl font-extrabold" id="paidLeaveDays">0</span>
            <span class="text-sm text-blue-100" id="lblDaysUnit">日 取得済み</span>
          </div>
        </div>
        <div class="text-right">
          <span class="text-xs bg-white/20 px-3 py-1 rounded-full text-white backdrop-blur-sm" id="lblPaidLeaveNotice">
            ※当システム経由の全取得合計
          </span>
        </div>
      </div>

      <!-- タブ切替 -->
      <div class="flex border-b border-slate-200">
        <button id="tabBtnNew" onclick="switchTab('new')" class="py-3 px-6 text-sm font-bold border-b-2 border-blue-600 text-blue-600 focus:outline-none flex items-center space-x-2">
          <i class="fa-solid fa-pen-to-square"></i>
          <span id="tabTitleNew">新規連絡・申請</span>
        </button>
        <button id="tabBtnList" onclick="switchTab('list')" class="py-3 px-6 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-700 focus:outline-none flex items-center space-x-2">
          <i class="fa-solid fa-list-check"></i>
          <span id="tabTitleList">連絡・申請履歴一覧</span>
        </button>
      </div>

      <!-- Tab 1: 新規連絡・申請フォーム -->
      <div id="tabNew" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <form id="attendanceForm" onsubmit="submitForm(event)" class="space-y-5">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-1" id="formLblName">氏名</label>
              <input type="text" id="name" readonly class="w-full bg-slate-100 border border-slate-300 rounded-lg p-2.5 text-slate-600 font-medium cursor-not-allowed">
            </div>
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-1" id="formLblDept">部署 / 工程</label>
              <input type="text" id="department" readonly class="w-full bg-slate-100 border border-slate-300 rounded-lg p-2.5 text-slate-600 font-medium cursor-not-allowed">
            </div>
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1" id="formLblType">連絡種別</label>
            <select id="type" required class="w-full border border-slate-300 rounded-lg p-2.5 bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
              <option value="">選択してください</option>
              <option value="有給休暇">有給休暇</option>
              <option value="欠勤">欠勤</option>
              <option value="遅刻">遅刻</option>
              <option value="早退">早退</option>
              <option value="その他">その他・業務連絡</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1" id="formLblDate">対象日 / 期間</label>
            <input type="text" id="datetime" required placeholder="例: 2026/05/10 または 2026/05/10〜2026/05/12"
              class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1" id="formLblReason">理由・詳細メッセージ</label>
            <textarea id="reason" rows="4" required placeholder="理由や連絡事項を詳しく記入してください..."
              class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
          </div>

          <div class="pt-2">
            <button type="submit" id="btnFormSubmit"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow transition duration-200 flex items-center justify-center space-x-2">
              <i class="fa-solid fa-paper-plane"></i>
              <span>送信する</span>
            </button>
          </div>
        </form>
      </div>

      <!-- Tab 2: 一覧画面 -->
      <div id="tabList" class="hidden space-y-4">
        
        <!-- 絞り込みフィルターエリア -->
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
          <div class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center space-x-1">
            <i class="fa-solid fa-filter"></i>
            <span id="filterTitle">絞り込み条件</span>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
            <!-- ユーザー範囲 -->
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1" id="lblFilterScope">表示範囲</label>
              <select id="filterUserScope" onchange="filterList()" class="w-full text-sm border border-slate-300 rounded-lg p-2 bg-slate-50">
                <option value="all">全員の申請</option>
                <option value="me">自分の申請のみ</option>
              </select>
            </div>

            <!-- 部署フィルター -->
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1" id="lblFilterDept">部署/工程</label>
              <select id="filterDept" onchange="filterList()" class="w-full text-sm border border-slate-300 rounded-lg p-2 bg-slate-50">
                <option value="">すべての部署</option>
                <!-- JSで動的生成 -->
              </select>
            </div>

            <!-- 開始日 -->
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1" id="lblFilterStart">開始日</label>
              <input type="date" id="filterStartDate" onchange="filterList()" class="w-full text-sm border border-slate-300 rounded-lg p-2 bg-slate-50">
            </div>

            <!-- 終了日 -->
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1" id="lblFilterEnd">終了日</label>
              <input type="date" id="filterEndDate" onchange="filterList()" class="w-full text-sm border border-slate-300 rounded-lg p-2 bg-slate-50">
            </div>
          </div>
        </div>

        <!-- 一覧カードコンテナ -->
        <div id="recordsContainer" class="space-y-3">
          <!-- JSで動的に追加されます -->
        </div>
      </div>

    </main>
  </div>

  <!-- ==================== チャットモーダル ==================== -->
  <div id="chatModal" class="modal opacity-0 pointer-events-none fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm transition-opacity">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg flex flex-col h-[600px] max-h-[90vh] overflow-hidden border border-slate-200">
      
      <!-- モーダルヘッダー -->
      <div class="p-4 bg-slate-800 text-white flex justify-between items-center">
        <div>
          <h3 class="font-bold text-base flex items-center space-x-2">
            <i class="fa-regular fa-comments text-blue-400"></i>
            <span id="chatTitle">連絡スレッド</span>
          </h3>
          <p class="text-xs text-slate-400" id="chatSub">REC ID: <span id="chatRecId">-</span></p>
        </div>
        <button onclick="closeChatModal()" class="text-slate-400 hover:text-white p-2 rounded-lg transition">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <!-- メッセージエリア -->
      <div id="chatMessages" class="flex-grow p-4 overflow-y-auto space-y-3 bg-slate-50">
        <!-- JSで動的に描画 -->
      </div>

      <!-- 入力エリア -->
      <form id="chatForm" onsubmit="sendChatMessage(event)" class="p-3 bg-white border-t border-slate-200 flex items-center space-x-2">
        <input type="text" id="chatInput" required placeholder="返信メッセージを入力..."
          class="flex-grow border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2 rounded-lg text-sm transition flex items-center space-x-1">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>
    </div>
  </div>


  <!-- JavaScript ロジック -->
  <script>
    // ==========================================
    // 【設定】GASのWeb App URLをここに貼付
    // ==========================================
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec";

    // 状態管理
    let currentUser = null;
    let isUserAdmin = false;
    let userDepartment = "";
    let currentLang = "ja";
    let allRecords = [];
    let currentActiveRecId = null;

    // 多言語辞書データ
    const i18nData = {
      ja: {
        loginTitle: "本人確認ログイン",
        loginSub: "従業員番号と生年月日を入力してください",
        lblEmpId: "従業員番号",
        lblDob: "暗証番号 / 生年月日",
        btnLogin: "ログイン",
        appTitle: "勤怠・連絡管理システム",
        lblPaidLeaveTitle: "本年度の有給休暇取得状況",
        lblDaysUnit: "日 取得済み",
        lblPaidLeaveNotice: "※当システム経由の全取得合計",
        tabTitleNew: "新規連絡・申請",
        tabTitleList: "連絡・申請履歴一覧",
        formLblName: "氏名",
        formLblDept: "部署 / 工程",
        formLblType: "連絡種別",
        formLblDate: "対象日 / 期間",
        formLblReason: "理由・詳細メッセージ",
        btnSubmit: "送信する",
        filterTitle: "絞り込み条件",
        lblFilterScope: "表示範囲",
        lblFilterDept: "部署/工程",
        lblFilterStart: "開始日",
        lblFilterEnd: "終了日",
        msgLoading: "データを読み込み中...",
        msgLoadErr: "データの取得に失敗しました",
        msgSuccessSend: "申請を送信しました！",
        msgSending: "送信中...",
        optAll: "全員の申請",
        optMe: "自分の申請のみ",
        optAllDept: "すべての部署"
      },
      vi: {
        loginTitle: "Xác nhận danh tính",
        loginSub: "Vui lòng nhập Mã số nhân viên và Ngày sinh",
        lblEmpId: "Mã số nhân viên",
        lblDob: "Mật khẩu / Ngày sinh",
        btnLogin: "Đăng nhập",
        appTitle: "Hệ thống Quản lý Chuyên cần",
        lblPaidLeaveTitle: "Tình hình nghỉ phép có lương năm nay",
        lblDaysUnit: "ngày đã nghỉ",
        lblPaidLeaveNotice: "※Tổng số ngày nghỉ qua hệ thống",
        tabTitleNew: "Tạo đơn / Thông báo mới",
        tabTitleList: "Lịch sử đơn & Thông báo",
        formLblName: "Họ và tên",
        formLblDept: "Bộ phận / Công đoạn",
        formLblType: "Loại thông báo",
        formLblDate: "Ngày / Thời gian対象",
        formLblReason: "Lý do / Tin nhắn chi tiết",
        btnSubmit: "Gửi đơn",
        filterTitle: "Điều kiện lọc",
        lblFilterScope: "Phạm vi hiển thị",
        lblFilterDept: "Bộ phận",
        lblFilterStart: "Từ ngày",
        lblFilterEnd: "Đến ngày",
        msgLoading: "Đang tải dữ liệu...",
        msgLoadErr: "Tải dữ liệu thất bại",
        msgSuccessSend: "Đã gửi đơn thành công!",
        msgSending: "Đang gửi...",
        optAll: "Tất cả mọi người",
        optMe: "Chỉ đơn của tôi",
        optAllDept: "Tất cả bộ phận"
      },
      en: {
        loginTitle: "Identity Authentication",
        loginSub: "Enter your Employee ID and Birthdate",
        lblEmpId: "Employee ID",
        lblDob: "Password / DOB",
        btnLogin: "Login",
        appTitle: "Attendance & Communication System",
        lblPaidLeaveTitle: "Paid Leave Taken This Year",
        lblDaysUnit: "Days Taken",
        lblPaidLeaveNotice: "* Total days recorded in system",
        tabTitleNew: "New Application",
        tabTitleList: "History & Status",
        formLblName: "Full Name",
        formLblDept: "Department / Section",
        formLblType: "Request Type",
        formLblDate: "Target Date / Period",
        formLblReason: "Reason / Details",
        btnSubmit: "Submit Request",
        filterTitle: "Filter Options",
        lblFilterScope: "Scope",
        lblFilterDept: "Department",
        lblFilterStart: "Start Date",
        lblFilterEnd: "End Date",
        msgLoading: "Loading data...",
        msgLoadErr: "Failed to load data",
        msgSuccessSend: "Successfully submitted!",
        msgSending: "Submitting...",
        optAll: "All Employees",
        optMe: "My Requests Only",
        optAllDept: "All Departments"
      }
    };

    // 初期化処理
    window.onload = function() {
      // ローカルストレージチェック
      const savedUser = localStorage.getItem('attendance_user');
      if (savedUser) {
        const uData = JSON.parse(savedUser);
        currentUser = uData.userName;
        isUserAdmin = uData.isAdmin;
        userDepartment = uData.department;
        showAppScreen();
      }
    };

    // 言語切り替え
    function changeLanguage(lang) {
      currentLang = lang;
      const dict = i18nData[lang];

      document.getElementById('loginTitle').innerText = dict.loginTitle;
      document.getElementById('loginSub').innerText = dict.loginSub;
      document.getElementById('lblEmpId').innerText = dict.lblEmpId;
      document.getElementById('lblDob').innerText = dict.lblDob;
      document.getElementById('btnLoginSubmit').innerText = dict.btnLogin;

      document.getElementById('appTitle').innerText = dict.appTitle;
      document.getElementById('lblPaidLeaveTitle').innerText = dict.lblPaidLeaveTitle;
      document.getElementById('lblDaysUnit').innerText = dict.lblDaysUnit;
      document.getElementById('lblPaidLeaveNotice').innerText = dict.lblPaidLeaveNotice;

      document.getElementById('tabTitleNew').innerText = dict.tabTitleNew;
      document.getElementById('tabTitleList').innerText = dict.tabTitleList;

      document.getElementById('formLblName').innerText = dict.formLblName;
      document.getElementById('formLblDept').innerText = dict.formLblDept;
      document.getElementById('formLblType').innerText = dict.formLblType;
      document.getElementById('formLblDate').innerText = dict.formLblDate;
      document.getElementById('formLblReason').innerText = dict.formLblReason;
      document.getElementById('btnFormSubmit').querySelector('span').innerText = dict.btnSubmit;

      document.getElementById('filterTitle').innerText = dict.filterTitle;
      document.getElementById('lblFilterScope').innerText = dict.lblFilterScope;
      document.getElementById('lblFilterDept').innerText = dict.lblFilterDept;
      document.getElementById('lblFilterStart').innerText = dict.lblFilterStart;
      document.getElementById('lblFilterEnd').innerText = dict.lblFilterEnd;

      // フィルターのドロップダウン初期テキスト変更
      const scopeSelect = document.getElementById('filterUserScope');
      scopeSelect.options[0].text = dict.optAll;
      scopeSelect.options[1].text = dict.optMe;

      renderRecords(allRecords);
    }

    // ログイン処理
    function handleLogin(e) {
      e.preventDefault();
      const empId = document.getElementById('loginEmpId').value.trim();
      const dob = document.getElementById('loginDob').value.trim();
      const errDiv = document.getElementById('loginError');

      errDiv.classList.add('hidden');

      fetch(`${GAS_WEB_APP_URL}?action=authenticate&empId=${encodeURIComponent(empId)}&dob=${encodeURIComponent(dob)}`)
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          currentUser = data.userName;
          isUserAdmin = data.isAdmin;
          userDepartment = data.department;

          localStorage.setItem('attendance_user', JSON.stringify(data));
          showAppScreen();
        } else {
          errDiv.innerText = data.message || "認証に失敗しました";
          errDiv.classList.remove('hidden');
        }
      })
      .catch(err => {
        errDiv.innerText = "通信エラーが発生しました";
        errDiv.classList.remove('hidden');
      });
    }

    // アプリ画面表示
    function showAppScreen() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('mainApp').classList.remove('hidden');

      document.getElementById('userInfo').innerText = `${userDepartment} - ${currentUser}`;
      document.getElementById('name').value = currentUser;
      document.getElementById('department').value = userDepartment;

      if (isUserAdmin) {
        document.getElementById('adminBadge').classList.remove('hidden');
      }

      preloadRecords();
    }

    // ログアウト
    function logout() {
      localStorage.removeItem('attendance_user');
      location.reload();
    }

    // タブ切り替え
    function switchTab(tab) {
      const tabNew = document.getElementById('tabNew');
      const tabList = document.getElementById('tabList');
      const btnNew = document.getElementById('tabBtnNew');
      const btnList = document.getElementById('tabBtnList');

      if (tab === 'new') {
        tabNew.classList.remove('hidden');
        tabList.classList.add('hidden');
        btnNew.className = "py-3 px-6 text-sm font-bold border-b-2 border-blue-600 text-blue-600 focus:outline-none flex items-center space-x-2";
        btnList.className = "py-3 px-6 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-700 focus:outline-none flex items-center space-x-2";
      } else {
        tabNew.classList.add('hidden');
        tabList.classList.remove('hidden');
        btnList.className = "py-3 px-6 text-sm font-bold border-b-2 border-blue-600 text-blue-600 focus:outline-none flex items-center space-x-2";
        btnNew.className = "py-3 px-6 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-700 focus:outline-none flex items-center space-x-2";
        fetchRecords();
      }
    }

    // データの事前取得（有給日数算出用）
    function preloadRecords() {
      fetch(`${GAS_WEB_APP_URL}?action=getRecords&empName=${encodeURIComponent(currentUser)}&isAdmin=${isUserAdmin}&limit=300`)
      .then(res => res.json())
      .then(data => {
        allRecords = data;
        calculatePaidLeave(data);
        populateDeptFilter(data);
      })
      .catch(err => console.log("Preload error"));
    }

    // 一覧用データ取得
    function fetchRecords() {
      const container = document.getElementById('recordsContainer');
      container.innerHTML = `<p class="text-center text-slate-500 py-8">${i18nData[currentLang].msgLoading}</p>`;

      fetch(`${GAS_WEB_APP_URL}?action=getRecords&empName=${encodeURIComponent(currentUser)}&isAdmin=${isUserAdmin}&limit=300`)
      .then(res => res.json())
      .then(data => {
        allRecords = data;
        calculatePaidLeave(data);
        populateDeptFilter(data);
        filterList();
      })
      .catch(err => {
        container.innerHTML = `<p class="text-center text-red-500 py-8">${i18nData[currentLang].msgLoadErr}</p>`;
      });
    }

    // 部署フィルターの動的生成
    function populateDeptFilter(data) {
      const deptSelect = document.getElementById('filterDept');
      const currentVal = deptSelect.value;
      const depts = [...new Set(data.map(r => r.department).filter(Boolean))];

      deptSelect.innerHTML = `<option value="">${i18nData[currentLang].optAllDept}</option>`;
      depts.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d;
        opt.innerText = d;
        deptSelect.appendChild(opt);
      });
      deptSelect.value = currentVal;
    }

    // 有給消化日数の計算
    function calculatePaidLeave(data) {
      let count = 0;
      data.forEach(r => {
        if (r.name === currentUser && r.type === "有給休暇") {
          count++;
        }
      });
      document.getElementById('paidLeaveDays').innerText = count;
    }

    // フィルタリング処理
    function filterList() {
      const scope = document.getElementById('filterUserScope').value;
      const startDateVal = document.getElementById('filterStartDate').value;
      const endDateVal = document.getElementById('filterEndDate').value;
      const selectedDept = document.getElementById('filterDept').value;

      const filtered = allRecords.filter(r => {
        if (scope === 'me' && r.name !== currentUser) return false;
        if (selectedDept && r.department !== selectedDept) return false;

        if (startDateVal || endDateVal) {
          if (!r.datetime) return false;
          const dateMatches = r.datetime.match(/\d{4}[\/-]\d{1,2}[\/-]\d{1,2}/g);
          if (!dateMatches) return false;

          const recDates = dateMatches.map(d => new Date(d.replace(/-/g, '/')).getTime());
          const recMinDate = Math.min(...recDates);
          const recMaxDate = Math.max(...recDates);

          if (startDateVal) {
            const filterStart = new Date(startDateVal.replace(/-/g, '/') + ' 00:00:00').getTime();
            if (recMaxDate < filterStart) return false;
          }

          if (endDateVal) {
            const filterEnd = new Date(endDateVal.replace(/-/g, '/') + ' 23:59:59').getTime();
            if (recMinDate > filterEnd) return false;
          }
        }
        return true;
      });

      renderRecords(filtered);
    }

    // レコード一覧の描画
    function renderRecords(records) {
      const container = document.getElementById('recordsContainer');
      container.innerHTML = '';

      if (records.length === 0) {
        container.innerHTML = `<div class="bg-white p-8 rounded-xl text-center text-slate-400 border border-slate-200">データが見つかりません</div>`;
        return;
      }

      records.forEach(r => {
        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition space-y-2";

        const typeColor = r.type === '有給休暇' ? 'bg-emerald-100 text-emerald-800' :
                          r.type === '欠勤' ? 'bg-rose-100 text-rose-800' :
                          'bg-amber-100 text-amber-800';

        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <span class="text-xs ${typeColor} font-bold px-2 py-0.5 rounded-full">${r.type}</span>
              <span class="text-xs text-slate-400 ml-2">${r.timestamp}</span>
            </div>
            <button onclick="openChatModal('${r.id}')" class="relative text-slate-500 hover:text-blue-600 p-1">
              <i class="fa-regular fa-comment-dots text-lg"></i>
              ${r.msgCount > 0 ? `<span class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">${r.msgCount}</span>` : ''}
            </button>
          </div>

          <div class="flex items-baseline space-x-2">
            <h4 class="font-bold text-slate-800">${r.name}</h4>
            <span class="text-xs text-slate-500">(${r.department})</span>
          </div>

          <p class="text-sm font-semibold text-blue-600"><i class="fa-regular fa-calendar-check mr-1"></i>${r.datetime}</p>
          <p class="text-xs text-slate-600 bg-slate-50 p-2 rounded border border-slate-100 whitespace-pre-wrap">${r.reason}</p>
        `;

        container.appendChild(card);
      });
    }

    // 新規申請送信処理
    function submitForm(e) {
      e.preventDefault();
      const btn = document.getElementById('btnFormSubmit');
      btn.disabled = true;
      btn.innerText = i18nData[currentLang].msgSending;

      const params = new URLSearchParams({
        action: 'addAttendance',
        name: currentUser,
        department: userDepartment,
        type: document.getElementById('type').value,
        datetime: document.getElementById('datetime').value,
        reason: document.getElementById('reason').value
      });

      fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        body: params
      })
      .then(res => res.json())
      .then(data => {
        alert(i18nData[currentLang].msgSuccessSend);
        document.getElementById('attendanceForm').reset();
        document.getElementById('name').value = currentUser;
        document.getElementById('department').value = userDepartment;
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-paper-plane mr-1"></i><span>${i18nData[currentLang].btnSubmit}</span>`;
        switchTab('list');
      })
      .catch(err => {
        alert("送信エラーが発生しました");
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-paper-plane mr-1"></i><span>${i18nData[currentLang].btnSubmit}</span>`;
      });
    }

    // モーダル管理
    function openChatModal(recId) {
      currentActiveRecId = recId;
      document.getElementById('chatRecId').innerText = recId;
      const modal = document.getElementById('chatModal');
      modal.classList.remove('opacity-0', 'pointer-events-none');
      document.body.classList.add('modal-active');
      loadChatMessages();
    }

    function closeChatModal() {
      const modal = document.getElementById('chatModal');
      modal.classList.add('opacity-0', 'pointer-events-none');
      document.body.classList.remove('modal-active');
      currentActiveRecId = null;
    }

    // チャットメッセージ読み込み
    function loadChatMessages() {
      const box = document.getElementById('chatMessages');
      box.innerHTML = `<p class="text-center text-xs text-slate-400 py-4">読み込み中...</p>`;

      fetch(`${GAS_WEB_APP_URL}?action=getMessages&recordId=${encodeURIComponent(currentActiveRecId)}`)
      .then(res => res.json())
      .then(messages => {
        box.innerHTML = '';
        if (messages.length === 0) {
          box.innerHTML = `<p class="text-center text-xs text-slate-400 py-4">メッセージはまだありません</p>`;
          return;
        }

        messages.forEach(m => {
          const isMe = m.sender === currentUser;
          const msgDiv = document.createElement('div');
          msgDiv.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;

          msgDiv.innerHTML = `
            <div class="text-[10px] text-slate-400 mb-0.5">${m.sender} - ${m.timestamp}</div>
            <div class="max-w-[80%] rounded-xl px-3 py-2 text-xs shadow-sm ${isMe ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white text-slate-800 border border-slate-200 rounded-bl-none'}">
              ${m.message}
            </div>
          `;
          box.appendChild(msgDiv);
        });

        box.scrollTop = box.scrollHeight;
      });
    }

    // チャットメッセージ送信
    function sendChatMessage(e) {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text || !currentActiveRecId) return;

      const params = new URLSearchParams({
        action: 'addMessage',
        recordId: currentActiveRecId,
        sender: currentUser,
        message: text,
        role: isUserAdmin ? '管理者' : '従業員'
      });

      input.value = '';

      fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        body: params
      })
      .then(res => res.json())
      .then(data => {
        loadChatMessages();
      });
    }
  </script>
</body>
</html>
