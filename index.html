<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>村田岡原 勤怠連絡システム</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --border-color: #cbd5e1;
      --accent-color: #16a34a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 12px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 20px;
      position: relative;
    }

    .lang-switcher {
      display: flex;
      justify-content: flex-end;
      gap: 4px;
      margin-bottom: 12px;
    }

    .lang-btn {
      padding: 4px 10px;
      font-size: 0.8rem;
      font-weight: bold;
      border: 1px solid var(--border-color);
      background: #f1f5f9;
      color: #64748b;
      border-radius: 6px;
      cursor: pointer;
    }

    .lang-btn.active {
      background: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }

    .user-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      background: #f1f5f9;
      padding: 8px 12px;
      border-radius: 8px;
    }

    .user-bar span {
      font-size: 0.85rem;
      font-weight: bold;
      color: #334155;
    }

    .logout-btn {
      padding: 4px 10px;
      font-size: 0.8rem;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .logout-btn:hover {
      background: #dc2626;
    }

    .auth-screen {
      text-align: center;
      padding: 10px 0;
    }

    .auth-screen h2 {
      margin-bottom: 4px;
      color: var(--primary-color);
      font-size: 1.2rem;
    }

    .auth-screen p {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 16px;
    }

    .auth-group {
      text-align: left;
      margin-bottom: 12px;
    }

    .auth-group label {
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 4px;
      display: block;
    }

    .auth-input {
      width: 100%;
      padding: 12px;
      font-size: 1.1rem;
      text-align: center;
      letter-spacing: 1px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      outline: none;
    }

    .auth-btn {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: bold;
      color: white;
      background-color: var(--primary-color);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 8px;
    }

    .main-app {
      display: none;
    }

    .tab-menu {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 8px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 6px;
      background: #f1f5f9;
      border: none;
      border-radius: 8px 8px 0 0;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      color: #64748b;
    }

    .tab-btn.active {
      background: var(--primary-color);
      color: white;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.3rem;
      color: var(--primary-color);
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    input[type="text"], input[type="password"], input[type="date"], input[type="datetime-local"], select, textarea {
      width: 100%;
      padding: 12px;
      font-size: 0.95rem;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      background-color: #fff;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary-color);
    }

    .range-inputs {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .range-inputs input {
      flex: 1;
    }

    .paid-leave-info {
      display: none;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-top: 8px;
    }

    .type-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .type-card {
      position: relative;
    }

    .type-card input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .type-card label {
      display: block;
      padding: 10px;
      background: #f1f5f9;
      border: 2px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      text-align: center;
      margin-bottom: 0;
    }

    .type-card input[type="radio"]:checked + label {
      background: #eff6ff;
      border-color: var(--primary-color);
      color: var(--primary-color);
      font-weight: bold;
    }

    .reason-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    button.submit-btn {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: bold;
      color: white;
      background-color: var(--primary-color);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 10px;
    }

    .success-msg {
      display: none;
      text-align: center;
      padding: 20px 0;
    }

    .filter-box {
      background: #f1f5f9;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .filter-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .filter-row > * {
      flex: 1;
    }

    .list-card {
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
      padding-bottom: 6px;
      border-bottom: 1px dashed var(--border-color);
    }

    .list-name {
      font-weight: bold;
      font-size: 1rem;
    }

    .list-dept {
      font-size: 0.75rem;
      background: #e2e8f0;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 4px;
    }

    .badge-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: flex-end;
    }

    .badge {
      font-size: 0.7rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 8px;
      white-space: nowrap;
    }

    .badge-approved {
      background-color: #dcfce7;
      color: #15803d;
    }

    .badge-pending {
      background-color: #fef3c7;
      color: #b45309;
    }

    .list-detail {
      font-size: 0.85rem;
      color: #334155;
      line-height: 1.4;
    }

    .list-reason, .list-remark {
      margin-top: 4px;
      font-size: 0.8rem;
      color: #64748b;
      background: #f8fafc;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .msg-toggle-btn {
      margin-top: 8px;
      width: 100%;
      padding: 6px 10px;
      font-size: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .msg-container {
      display: none;
      margin-top: 8px;
      border-top: 1px solid var(--border-color);
      padding-top: 8px;
      background: #f8fafc;
      border-radius: 6px;
      padding: 8px;
    }

    .msg-history {
      max-height: 150px;
      overflow-y: auto;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .msg-item {
      font-size: 0.8rem;
      padding: 6px 10px;
      border-radius: 8px;
      max-width: 85%;
      word-wrap: break-word;
    }

    .msg-item.applicant {
      background: #dbeafe;
      align-self: flex-end;
      color: #1e40af;
    }

    .msg-item.manager {
      background: #e2e8f0;
      align-self: flex-start;
      color: #0f172a;
    }

    .msg-meta {
      font-size: 0.65rem;
      color: #64748b;
      margin-bottom: 2px;
    }

    .msg-input-box {
      display: flex;
      gap: 6px;
    }

    .msg-input-box input {
      flex: 1;
      padding: 6px 8px;
      font-size: 0.8rem;
      border-radius: 6px;
    }

    .msg-input-box button {
      padding: 6px 12px;
      font-size: 0.8rem;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- 言語切替ボタン -->
  <div class="lang-switcher">
    <button class="lang-btn active" onclick="setLanguage('ja')">JP-日本語</button>
    <button class="lang-btn" onclick="setLanguage('vi')">VN-Tiếng Việt</button>
    <button class="lang-btn" onclick="setLanguage('en')">EN-English</button>
  </div>

  <!-- 本人確認画面 -->
  <div id="authScreen" class="auth-screen">
    <h2 data-i18n="authTitle">本人確認</h2>
    <p data-i18n="authSub">社員IDと暗証番号を入力してください</p>
    
    <div class="auth-group">
      <label data-i18n="lblEmpId">社員ID</label>
      <input type="text" id="empIdInput" class="auth-input" placeholder="0015">
    </div>

    <div class="auth-group">
      <label data-i18n="lblPass">暗証番号（月日4桁）</label>
      <input type="password" id="passInput" class="auth-input" maxlength="4" placeholder="••••">
    </div>

    <button onclick="checkAuth()" id="loginBtn" class="auth-btn" data-i18n="btnLogin">ログイン</button>
    <p id="passError" style="color: red; margin-top: 10px; display: none;"></p>
  </div>

  <!-- アプリ本体 -->
  <div id="mainApp" class="main-app">

    <!-- ログインユーザー情報 & ログアウトボタン -->
    <div class="user-bar">
      <span id="loginUserInfo"></span>
      <button onclick="logout()" class="logout-btn" data-i18n="btnLogout">ログアウト</button>
    </div>

    <div class="tab-menu">
      <button class="tab-btn active" onclick="switchTab('form')" data-i18n="tabSend">勤怠送信</button>
      <button class="tab-btn" onclick="switchTab('list')" data-i18n="tabList">連絡一覧</button>
    </div>

    <!-- フォーム画面 -->
    <div id="formTab">
      <div class="header">
        <h1 data-i18n="formTitle">村田岡原 勤怠連絡</h1>
      </div>

      <form id="attendanceForm">
        <div class="form-group">
          <label data-i18n="lbl1Name">1. お名前</label>
          <input type="text" id="name" name="name" readonly style="background-color: #f1f5f9;" required>
        </div>

        <div class="form-group">
          <label data-i18n="lbl2Dept">2. あなたの工程</label>
          <input type="text" id="department" name="department" readonly style="background-color: #f1f5f9;" required>
        </div>

        <div class="form-group">
          <label data-i18n="lbl3Type">3. 連絡の種類</label>
          <div class="type-grid">
            <div class="type-card">
              <input type="radio" id="type1" name="type" value="有給" onchange="toggleDateInput('date')" required>
              <label for="type1" data-i18n="typePaid">有給</label>
            </div>
            <div class="type-card">
              <input type="radio" id="type2" name="type" value="半休" onchange="toggleDateInput('half')">
              <label for="type2" data-i18n="typeHalf">半休</label>
            </div>
            <div class="type-card">
              <input type="radio" id="type3" name="type" value="欠勤" onchange="toggleDateInput('date')">
              <label for="type3" data-i18n="typeAbsent">欠勤</label>
            </div>
            <div class="type-card">
              <input type="radio" id="type4" name="type" value="遅刻" onchange="toggleDateInput('datetime')">
              <label for="type4" data-i18n="typeLate">遅刻</label>
            </div>
            <div class="type-card">
              <input type="radio" id="type5" name="type" value="早退" onchange="toggleDateInput('datetime')">
              <label for="type5" data-i18n="typeEarly">早退</label>
            </div>
            <div class="type-card">
              <input type="radio" id="type6" name="type" value="中抜け" onchange="toggleDateInput('datetime')">
              <label for="type6" data-i18n="typeOut">中抜け</label>
            </div>
          </div>
        </div>

        <div class="form-group" id="dateInputArea">
          <label data-i18n="lbl4Date">4. 日付・時間</label>

          <div id="singleDateBlock">
            <div class="range-inputs">
              <input type="date" id="startDate" name="startDate" onchange="checkSameDay()">
              <span id="rangeSeparator">〜</span>
              <input type="date" id="endDate" name="endDate" placeholder="終了日（任意）">
            </div>
            <span style="font-size: 0.75rem; color: #64748b; margin-top: 4px; display: block;" data-i18n="hintDateRange">※1日のみの場合は終了日を空欄にしてください</span>
          </div>

          <div id="halfDateBlock" style="display: none;">
            <input type="date" id="halfDate" name="halfDate" style="margin-bottom: 8px;" onchange="checkSameDay()">
            <select id="halfAmpm" name="halfAmpm">
              <option value="午前 (AM)" data-i18n="optAm">午前 (AM)</option>
              <option value="午後 (PM)" data-i18n="optPm">午後 (PM)</option>
            </select>
          </div>

          <div id="dateTimeBlock" style="display: none;">
            <input type="datetime-local" id="targetDateTime" name="targetDateTime" onchange="checkSameDay()">
          </div>

          <div id="sameDayWarning" style="display: none; margin-top: 10px; padding: 10px; border: 1px solid #ef4444; background-color: #fef2f2; border-radius: 8px; color: #dc2626; font-size: 0.85rem; font-weight: bold;">
            <span data-i18n="msgSameDayNotice">⚠️ 原則として事前申請と承認が必要です。当日申請を行う場合は、本システムの送信に加え、必ず直接責任者へご連絡ください。</span>
          </div>

          <div id="paidLeaveInfo" class="paid-leave-info">
            📅 今年度の有給使用日数：<span id="paidLeaveCount">0</span> 日
          </div>
        </div>

        <div class="form-group">
          <label data-i18n="lbl5Reason">5. 理由</label>
          <div class="reason-grid">
            <div class="type-card">
              <input type="radio" id="reason1" name="reason" value="体調不良" onchange="toggleOtherReason(false)" required>
              <label for="reason1" style="text-align: left;" data-i18n="reason1">① 体調不良</label>
            </div>
            <div class="type-card">
              <input type="radio" id="reason2" name="reason" value="通院" onchange="toggleOtherReason(false)">
              <label for="reason2" style="text-align: left;" data-i18n="reason2">② 通院</label>
            </div>
            <div class="type-card">
              <input type="radio" id="reason3" name="reason" value="私用" onchange="toggleOtherReason(false)">
              <label for="reason3" style="text-align: left;" data-i18n="reason3">③ 私用</label>
            </div>
            <div class="type-card">
              <input type="radio" id="reason4" name="reason" value="その他" onchange="toggleOtherReason(true)">
              <label for="reason4" style="text-align: left;" data-i18n="reason4">④ その他</label>
            </div>
          </div>
          <div id="otherReasonBlock" style="display: none; margin-top: 8px;">
            <textarea id="otherReasonText" name="otherReasonText" rows="2" data-i18n-ph="phReason" placeholder="理由を入力してください"></textarea>
          </div>
        </div>

        <div class="form-group">
          <label data-i18n="lbl6Remark">6. 備考（任意）</label>
          <textarea id="remark" name="remark" rows="2" data-i18n-ph="phRemark" placeholder="追加の連絡事項があれば入力してください"></textarea>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn" data-i18n="btnSubmit">送信する</button>
      </form>

      <div id="successMessage" class="success-msg">
        <h2 style="color: var(--accent-color);" data-i18n="msgSuccess">送信完了！</h2>
        <p style="margin-top: 10px; font-size: 0.85rem; color: #64748b;" data-i18n="msgNotified">管理者に通知されました。</p>
        <button onclick="resetForm()" class="submit-btn" style="margin-top: 15px; background: #64748b;" data-i18n="btnAgain">もう一度入力する</button>
      </div>
    </div>

    <!-- 連絡一覧画面 -->
    <div id="listTab" style="display: none;">
      <div class="header">
        <h1 data-i18n="listTitle">連絡一覧・承認状況</h1>
      </div>

      <div class="filter-box">
        <div class="filter-row">
          <select id="filterUserScope" onchange="filterList()">
            <option value="me" selected data-i18n="optScopeMe">自分を表示</option>
            <option value="all" data-i18n="optScopeAll">全員を表示</option>
          </select>
          <input type="date" id="filterDate" onchange="filterList()">
        </div>
        
        <div class="filter-row" style="margin-bottom: 0;">
          <select id="filterDept" onchange="filterList()">
            <option value="" data-i18n="filterAllDept">すべての工程</option>
            <option value="QA外観検査" data-i18n="deptQAInspect">QA外観検査</option>
            <option value="QA寸法測定" data-i18n="deptQAMeasure">QA寸法測定</option>
            <option value="外観検査" data-i18n="deptInspect">外観検査</option>
            <option value="画像検査" data-i18n="deptImgInspect">画像検査</option>
            <option value="総務" data-i18n="deptGeneral">総務</option>
            <option value="ダイシング" data-i18n="deptDicing">ダイシング</option>
            <option value="トレイ詰・集計" data-i18n="deptTray">トレイ詰・集計</option>
            <option value="担当窓口" data-i18n="deptContact">担当窓口</option>
            <option value="密閉ボックス洗浄" data-i18n="deptCleaning">密閉ボックス洗浄</option>
            <option value="ﾛｯﾄｶｰﾄﾞｽｷｬﾝ" data-i18n="deptScan">ﾛｯﾄｶｰﾄﾞｽｷｬﾝ</option>
            <option value="通訳" data-i18n="deptInterpreter">通訳</option>
            <option value="インフラ" data-i18n="deptInfra">インフラ</option>
          </select>
        </div>
        
        <button onclick="clearFilter()" style="width: 100%; padding: 6px; font-size: 0.8rem; background: #cbd5e1; border: none; border-radius: 4px; cursor: pointer; margin-top: 8px;" data-i18n="btnClearFilter">検索クリア</button>
      </div>

      <div id="recordsContainer">
        <p style="text-align: center; color: #64748b; padding: 20px;" data-i18n="msgLoading">読み込み中...</p>
      </div>
    </div>

  </div>
</div>

<script>
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxi4zgaCvxGtIbnEYuoOYBob1T1LTyrm1F9llB3KRSBad-gFBcDJ7v_9b3FnM3O_ZwIaA/exec";

  let currentLang = 'ja';
  let userDeptJa = '';
  let allRecords = [];
  let isUserAdmin = false;

  const i18nData = {
    ja: {
      authTitle: "本人確認",
      authSub: "社員IDと暗証番号を入力してください",
      lblEmpId: "社員ID",
      lblPass: "暗証番号（月日4桁 例: 0912）",
      btnLogin: "ログイン",
      btnLogout: "ログアウト",
      confirmLogout: "ログアウトしますか？",
      errAuthBlank: "IDと暗証番号（月日）を入力してください",
      errAuthCheck: "確認中...",
      errAuthFail: "IDまたは暗証番号（月日）が違います",
      errAuthNet: "通信エラーが発生しました",
      tabSend: "勤怠送信",
      tabList: "連絡一覧",
      formTitle: "村田岡原 勤怠連絡",
      lbl1Name: "1. お名前",
      lbl2Dept: "2. あなたの工程",
      deptQAInspect: "QA外観検査",
      deptQAMeasure: "QA寸法測定",
      deptInspect: "外観検査",
      deptImgInspect: "画像検査",
      deptGeneral: "総務",
      deptDicing: "ダイシング",
      deptTray: "トレイ詰・集計",
      deptContact: "工場長",
      deptCleaning: "密閉ボックス洗浄",
      deptScan: "ﾛｯﾄｶｰﾄﾞｽｷｬﾝ",
      deptInterpreter: "通訳",

  function translateDept(deptJa, lang) {
    if (!deptJa) return i18nData[lang].unset;
    const key = deptKeyMap[deptJa.trim()];
    return (key && i18nData[lang][key]) ? i18nData[lang][key] : deptJa;
  }

  function translateType(typeJa, lang) {
    if (!typeJa) return typeJa;
    const key = typeKeyMap[typeJa.trim()];
    return (key && i18nData[lang][key]) ? i18nData[lang][key] : typeJa;
  }

  function setLanguage(lang) {
    currentLang = lang;
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.classList.toggle('active', btn.innerText.toLowerCase() === (lang === 'ja' ? 'jp' : lang));
    });

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (i18nData[lang][key]) {
        el.innerText = i18nData[lang][key];
      }
    });

    document.querySelectorAll('[data-i18n-ph]').forEach(el => {
      const key = el.getAttribute('data-i18n-ph');
      if (i18nData[lang][key]) {
        el.placeholder = i18nData[lang][key];
      }
    });

    if (userDeptJa) {
      document.getElementById('department').value = translateDept(userDeptJa, lang);
    }

    updatePaidLeaveCountUI();

    if (allRecords.length > 0) {
      filterList();
    }
  }

  function checkAuth() {
    const empId = document.getElementById('empIdInput').value.trim();
    const dob = document.getElementById('passInput').value.trim();
    const errEl = document.getElementById('passError');
    const loginBtn = document.getElementById('loginBtn');

    if (!empId || !dob) {
      errEl.innerText = i18nData[currentLang].errAuthBlank;
      errEl.style.display = 'block';
      return;
    }

    loginBtn.disabled = true;
    loginBtn.innerText = i18nData[currentLang].errAuthCheck;
    errEl.style.display = 'none';

    fetch(`${GAS_WEB_APP_URL}?action=authenticate&empId=${encodeURIComponent(empId)}&dob=${encodeURIComponent(dob)}`)
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        userDeptJa = data.department || '';
        isUserAdmin = !!data.isAdmin;
        document.getElementById('name').value = data.userName;
        document.getElementById('department').value = translateDept(userDeptJa, currentLang);

        document.getElementById('loginUserInfo').innerText = `👤 ${data.userName}`;

        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        preloadRecords();
        checkSameDay();
      } else {
        errEl.innerText = i18nData[currentLang].errAuthFail;
        errEl.style.display = 'block';
        loginBtn.disabled = false;
        loginBtn.innerText = i18nData[currentLang].btnLogin;
      }
    })
    .catch(err => {
      errEl.innerText = i18nData[currentLang].errAuthNet;
      errEl.style.display = 'block';
      loginBtn.disabled = false;
      loginBtn.innerText = i18nData[currentLang].btnLogin;
    });
  }

  function logout() {
    if (!confirm(i18nData[currentLang].confirmLogout)) return;

    document.getElementById('empIdInput').value = '';
    document.getElementById('passInput').value = '';
    document.getElementById('loginBtn').disabled = false;
    document.getElementById('loginBtn').innerText = i18nData[currentLang].btnLogin;

    userDeptJa = '';
    allRecords = [];
    isUserAdmin = false;

    resetForm();

    document.getElementById('mainApp').style.display = 'none';
    document.getElementById('authScreen').style.display = 'block';
  }

  function switchTab(tab) {
    const formTab = document.getElementById('formTab');
    const listTab = document.getElementById('listTab');
    const btns = document.querySelectorAll('.tab-btn');

    if (tab === 'form') {
      formTab.style.display = 'block';
      listTab.style.display = 'none';
      btns[0].classList.add('active');
      btns[1].classList.remove('active');
    } else {
      formTab.style.display = 'none';
      listTab.style.display = 'block';
      btns[0].classList.remove('active');
      btns[1].classList.add('active');
      fetchRecords();
    }
  }

  function checkSameDay() {
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    const todayStr = `${yyyy}-${mm}-${dd}`;

    const type = document.querySelector('input[name="type"]:checked')?.value || '';
    let selectedDateStr = '';

    if (type === '有給' || type === '欠勤') {
      selectedDateStr = document.getElementById('startDate').value;
    } else if (type === '半休') {
      selectedDateStr = document.getElementById('halfDate').value;
    } else if (type === '遅刻' || type === '早退' || type === '中抜け') {
      const val = document.getElementById('targetDateTime').value;
      if (val) selectedDateStr = val.split('T')[0];
    }

    const warningEl = document.getElementById('sameDayWarning');
    if (selectedDateStr && selectedDateStr === todayStr) {
      warningEl.style.display = 'block';
    } else {
      warningEl.style.display = 'none';
    }
  }

  function toggleDateInput(mode) {
    document.getElementById('singleDateBlock').style.display = (mode === 'date') ? 'block' : 'none';
    document.getElementById('halfDateBlock').style.display = (mode === 'half') ? 'block' : 'none';
    document.getElementById('dateTimeBlock').style.display = (mode === 'datetime') ? 'block' : 'none';

    const selectedType = document.querySelector('input[name="type"]:checked')?.value;
    const paidInfoEl = document.getElementById('paidLeaveInfo');
    if (selectedType === '有給' || selectedType === '半休') {
      paidInfoEl.style.display = 'block';
      calculatePaidLeaveCount();
    } else {
      paidInfoEl.style.display = 'none';
    }

    checkSameDay();
  }

  function calculatePaidLeaveCount() {
    const userName = document.getElementById('name').value;
    if (!userName || allRecords.length === 0) return;

    const today = new Date();
    const currentYear = today.getFullYear();
    
    let startDate, endDate;
    const fiscalStartThisYear = new Date(currentYear, 2, 16);

    if (today >= fiscalStartThisYear) {
      startDate = new Date(currentYear, 2, 16);
      endDate = new Date(currentYear + 1, 2, 15, 23, 59, 59);
    } else {
      startDate = new Date(currentYear - 1, 2, 16);
      endDate = new Date(currentYear, 2, 15, 23, 59, 59);
    }

    let totalDays = 0;
    allRecords.forEach(r => {
      const mgrStatus = String(r.managerStatus || '').trim();
      const facStatus = String(r.factoryStatus || '').trim();
      const isMgrApproved = !mgrStatus.includes("未") && !mgrStatus.includes("Pending") && (mgrStatus.includes("承認") || mgrStatus.includes("Approved"));
      const isFacApproved = !facStatus.includes("未") && !facStatus.includes("Pending") && (facStatus.includes("承認") || facStatus.includes("Approved"));

      if (isMgrApproved && isFacApproved) {
        if (r.name === userName && (r.type === '有給' || r.type === '半休')) {
          const dateMatches = r.datetime.match(/\d{4}[\/-]\d{1,2}[\/-]\d{1,2}/g);
          if (dateMatches) {
            const recStart = new Date(dateMatches[0].replace(/-/g, '/'));
            if (recStart >= startDate && recStart <= endDate) {
              if (r.type === '半休') {
                totalDays += 0.5;
              } else if (dateMatches.length >= 2) {
                const recEnd = new Date(dateMatches[1].replace(/-/g, '/'));
                const diffTime = Math.abs(recEnd - recStart);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
                totalDays += diffDays;
              } else {
                totalDays += 1;
              }
            }
          }
        }
      }
    });

    document.getElementById('paidLeaveCount').innerText = totalDays;
    updatePaidLeaveCountUI();
  }

  function updatePaidLeaveCountUI() {
    const count = document.getElementById('paidLeaveCount').innerText;
    const infoEl = document.getElementById('paidLeaveInfo');
    infoEl.innerHTML = `${i18nData[currentLang].paidCountMsg}<span id="paidLeaveCount">${count}</span>${i18nData[currentLang].countUnit}`;
  }

  function toggleOtherReason(isOther) {
    document.getElementById('otherReasonBlock').style.display = isOther ? 'block' : 'none';
    if (!isOther) {
      document.getElementById('otherReasonText').value = '';
    }
  }

  document.getElementById('attendanceForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const type = document.querySelector('input[name="type"]:checked')?.value || '';

    let confirmMsg = (type === '遅刻' || type === '早退' || type === '中抜け') 
      ? i18nData[currentLang].alertTimecard 
      : i18nData[currentLang].alertResend;

    if (!confirm(confirmMsg)) return;

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.innerText = i18nData[currentLang].btnSending;
    submitBtn.disabled = true;

    const name = document.getElementById('name').value;
    const department = userDeptJa || document.getElementById('department').value;
    
    let datetime = '';
    if (type === '有給' || type === '欠勤') {
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;
      datetime = (endDate && endDate !== startDate) ? `${startDate} 〜 ${endDate}` : startDate;
    } else if (type === '半休') {
      datetime = `${document.getElementById('halfDate').value} ${document.getElementById('halfAmpm').value}`;
    } else {
      datetime = document.getElementById('targetDateTime').value.replace('T', ' ');
    }

    let reason = document.querySelector('input[name="reason"]:checked')?.value || '';
    if (reason === 'その他') {
      const otherDetail = document.getElementById('otherReasonText').value;
      reason = otherDetail ? `その他: ${otherDetail}` : 'その他';
    }

    const remark = document.getElementById('remark').value.trim();

    const payload = new URLSearchParams();
    payload.append('action', 'addAttendance');
    payload.append('name', name);
    payload.append('department', department);
    payload.append('type', type);
    payload.append('datetime', datetime);
    payload.append('reason', reason);
    payload.append('remark', remark);

    fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: payload.toString()
    })
    .then(response => {
      document.getElementById('attendanceForm').style.display = 'none';
      document.getElementById('successMessage').style.display = 'block';
    })
    .catch(error => {
      alert("送信に失敗しました。");
      submitBtn.innerText = i18nData[currentLang].btnSubmit;
      submitBtn.disabled = false;
    });
  });

  function resetForm() {
    const savedName = document.getElementById('name').value;
    
    document.getElementById('attendanceForm').reset();
    
    document.getElementById('name').value = savedName;
    document.getElementById('department').value = translateDept(userDeptJa, currentLang);

    document.getElementById('attendanceForm').style.display = 'block';
    document.getElementById('successMessage').style.display = 'none';
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.innerText = i18nData[currentLang].btnSubmit;
    submitBtn.disabled = false;
    document.getElementById('startDate').valueAsDate = new Date();
    document.getElementById('paidLeaveInfo').style.display = 'none';
    toggleDateInput('date');
    toggleOtherReason(false);
  }

  function preloadRecords() {
    const currentUserName = document.getElementById('name').value;
    fetch(`${GAS_WEB_APP_URL}?action=getRecords&empName=${encodeURIComponent(currentUserName)}&isAdmin=${isUserAdmin}`)
    .then(res => res.json())
    .then(data => {
      allRecords = data;
    })
    .catch(err => console.log("Preload error"));
  }

  function fetchRecords() {
    const container = document.getElementById('recordsContainer');
    container.innerHTML = `<p style="text-align: center; color: #64748b; padding: 20px;">${i18nData[currentLang].msgLoading}</p>`;

    const currentUserName = document.getElementById('name').value;
    fetch(`${GAS_WEB_APP_URL}?action=getRecords&empName=${encodeURIComponent(currentUserName)}&isAdmin=${isUserAdmin}`)
    .then(res => res.json())
    .then(data => {
      allRecords = data;
      filterList();
    })
    .catch(err => {
      container.innerHTML = `<p style="text-align: center; color: red;">${i18nData[currentLang].msgLoadErr}</p>`;
    });
  }

  function renderRecords(records) {
    const container = document.getElementById('recordsContainer');
    if (!records || records.length === 0) {
      container.innerHTML = `<p style="text-align: center; color: #64748b; padding: 20px;">${i18nData[currentLang].msgNoData}</p>`;
      return;
    }

    const currentUserName = document.getElementById('name').value;

    let html = '';
    records.forEach(r => {
      const mgrStatus = String(r.managerStatus || '').trim();
      const facStatus = String(r.factoryStatus || '').trim();

      const isMgrApproved = !mgrStatus.includes("未") && !mgrStatus.includes("Pending") && (mgrStatus.includes("承認") || mgrStatus.includes("Approved"));
      const isFacApproved = !facStatus.includes("未") && !facStatus.includes("Pending") && (facStatus.includes("承認") || facStatus.includes("Approved"));

      const mgrBadgeClass = isMgrApproved ? 'badge-approved' : 'badge-pending';
      const facBadgeClass = isFacApproved ? 'badge-approved' : 'badge-pending';

      const mgrText = isMgrApproved ? i18nData[currentLang].mgrOk : i18nData[currentLang].mgrNg;
      const facText = isFacApproved ? i18nData[currentLang].facOk : i18nData[currentLang].facNg;

      const displayDept = translateDept(r.department, currentLang);
      const displayType = translateType(r.type, currentLang);

      const isOwner = (r.name === currentUserName);
      const canAccessPrivateInfo = isOwner || isUserAdmin;

      // 閲覧権限がある場合のみ理由を表示
      let reasonHtml = '';
      if (canAccessPrivateInfo && r.reason) {
        reasonHtml = `<div class="list-reason"><strong>${i18nData[currentLang].lblReasonTitle}</strong> ${r.reason}</div>`;
      }

      // 閲覧権限がある場合のみ備考を表示
      let remarkHtml = '';
      if (canAccessPrivateInfo && r.remark) {
        remarkHtml = `<div class="list-remark"><strong>${i18nData[currentLang].lblRemarkTitle}</strong> ${r.remark}</div>`;
      }

      // 閲覧権限がある場合のみメッセージエリアを表示
      let msgAreaHtml = '';
      if (canAccessPrivateInfo) {
        const count = r.msgCount || 0;
        let btnText = '';
        let btnStyle = '';

        if (count > 0) {
          btnText = i18nData[currentLang].btnMsgHasCount.replace('{count}', count);
          btnStyle = 'background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5;';
        } else {
          btnText = i18nData[currentLang].btnMsgOpen;
          btnStyle = 'background: #e2e8f0; color: #334155; border: 1px solid transparent;';
        }

        msgAreaHtml = `
          <button class="msg-toggle-btn" style="${btnStyle}" onclick="toggleMessageBox('${r.id}')">
            <span id="msgBtnText_${r.id}">${btnText}</span>
            <span>▼</span>
          </button>

          <div class="msg-container" id="msgBox_${r.id}">
            <div class="msg-history" id="msgHistory_${r.id}">
              <span style="font-size:0.75rem; color:#94a3b8;">読み込み中...</span>
            </div>
            <div class="msg-input-box">
              <input type="text" id="msgInput_${r.id}" placeholder="${i18nData[currentLang].phMsgInput}">
              <button onclick="sendChatMessage('${r.id}')">${i18nData[currentLang].btnMsgSend}</button>
            </div>
          </div>
        `;
      }

      html += `
        <div class="list-card">
          <div class="list-header">
            <span class="list-name">${r.name} <span class="list-dept">${displayDept}</span></span>
            <div class="badge-group">
              <span class="badge ${mgrBadgeClass}">${mgrText}</span>
              <span class="badge ${facBadgeClass}">${facText}</span>
            </div>
          </div>
          <div class="list-detail">
            <strong>【${displayType}】</strong> ${r.datetime}
          </div>
          ${reasonHtml}
          ${remarkHtml}
          ${msgAreaHtml}
        </div>
      `;
    });
    container.innerHTML = html;
  }

  function toggleMessageBox(recordId) {
    const box = document.getElementById(`msgBox_${recordId}`);
    if (box.style.display === 'block') {
      box.style.display = 'none';
    } else {
      box.style.display = 'block';
      loadChatMessages(recordId);
    }
  }

  function loadChatMessages(recordId) {
    const historyEl = document.getElementById(`msgHistory_${recordId}`);
    const currentUserName = document.getElementById('name').value;
    
    fetch(`${GAS_WEB_APP_URL}?action=getMessages&recordId=${encodeURIComponent(recordId)}`)
    .then(res => res.json())
    .then(list => {
      if (!list || list.length === 0) {
        historyEl.innerHTML = `<span style="font-size:0.75rem; color:#94a3b8;">メッセージはありません</span>`;
        return;
      }
      
      let html = '';
      list.forEach(m => {
        const isSelf = (m.sender === currentUserName) || (m.role === 'Applicant' && !isUserAdmin);
        const cls = isSelf ? 'applicant' : 'manager';
        
        html += `
          <div class="msg-item ${cls}">
            <div class="msg-meta">${m.sender || ''} • ${m.timestamp || ''}</div>
            <div>${m.message || ''}</div>
          </div>
        `;
      });
      historyEl.innerHTML = html;
      historyEl.scrollTop = historyEl.scrollHeight;
    })
    .catch(err => {
      historyEl.innerHTML = `<span style="font-size:0.75rem; color:red;">エラーが発生しました</span>`;
    });
  }

  function sendChatMessage(recordId) {
    const inputEl = document.getElementById(`msgInput_${recordId}`);
    const message = inputEl.value.trim();
    const userName = document.getElementById('name').value;

    if (!message) return;

    inputEl.disabled = true;

    const payload = new URLSearchParams();
    payload.append('action', 'addMessage');
    payload.append('recordId', recordId);
    payload.append('sender', userName);
    payload.append('role', isUserAdmin ? 'Manager' : 'Applicant');
    payload.append('message', message);

    fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: payload.toString()
    })
    .then(res => res.json())
    .then(data => {
      inputEl.value = '';
      inputEl.disabled = false;
      loadChatMessages(recordId);
      fetchRecords();
    })
    .catch(err => {
      alert("メッセージの送信に失敗しました");
      inputEl.disabled = false;
    });
  }

  function filterList() {
    const scope = document.getElementById('filterUserScope').value;
    const selectedDate = document.getElementById('filterDate').value;
    const selectedDept = document.getElementById('filterDept').value;
    const currentUserName = document.getElementById('name').value;

    const filtered = allRecords.filter(r => {
      if (scope === 'me' && r.name !== currentUserName) {
        return false;
      }

      let matchDate = true;
      if (selectedDate && r.datetime) {
        const formattedTargetDate = r.datetime.replace(/\//g, '-');
        matchDate = formattedTargetDate.includes(selectedDate);
      }

      const matchDept = !selectedDept || r.department === selectedDept;

      return matchDate && matchDept;
    });

    renderRecords(filtered.slice(0, 30));
  }

  function clearFilter() {
    document.getElementById('filterUserScope').value = 'me';
    document.getElementById('filterDate').value = '';
    document.getElementById('filterDept').value = '';
    filterList();
  }
</script>

</body>
</html>
