<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>勤怠・連絡 / Liên lạc nghỉ làm / Absence Notice</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --border-color: #cbd5e1;
      --accent-color: #16a34a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 12px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 20px;
    }

    .auth-screen {
      text-align: center;
      padding: 10px 0;
    }

    .auth-screen h2 {
      margin-bottom: 4px;
      color: var(--primary-color);
      font-size: 1.2rem;
    }

    .auth-screen p {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 16px;
    }

    .auth-group {
      text-align: left;
      margin-bottom: 12px;
    }

    .auth-group label {
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 4px;
      display: block;
    }

    .auth-input {
      width: 100%;
      padding: 12px;
      font-size: 1.1rem;
      text-align: center;
      letter-spacing: 1px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      outline: none;
    }

    .auth-btn {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: bold;
      color: white;
      background-color: var(--primary-color);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 8px;
    }

    .main-app {
      display: none;
    }

    .tab-menu {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 8px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 6px;
      background: #f1f5f9;
      border: none;
      border-radius: 8px 8px 0 0;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      color: #64748b;
    }

    .tab-btn.active {
      background: var(--primary-color);
      color: white;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.3rem;
      color: var(--primary-color);
    }

    .header p {
      font-size: 0.85rem;
      color: #64748b;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    label .sub {
      display: block;
      font-weight: normal;
      font-size: 0.8rem;
      color: #64748b;
    }

    input[type="text"], input[type="password"], input[type="date"], input[type="datetime-local"], select, textarea {
      width: 100%;
      padding: 12px;
      font-size: 0.95rem;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      background-color: #fff;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary-color);
    }

    .type-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .type-card {
      position: relative;
    }

    .type-card input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .type-card label {
      display: block;
      padding: 10px;
      background: #f1f5f9;
      border: 2px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      text-align: center;
      margin-bottom: 0;
    }

    .type-card input[type="radio"]:checked + label {
      background: #eff6ff;
      border-color: var(--primary-color);
      color: var(--primary-color);
      font-weight: bold;
    }

    .reason-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    button.submit-btn {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: bold;
      color: white;
      background-color: var(--primary-color);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 10px;
    }

    .success-msg {
      display: none;
      text-align: center;
      padding: 20px 0;
    }

    .filter-box {
      background: #f1f5f9;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .filter-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .filter-row > * {
      flex: 1;
    }

    .list-card {
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
      padding-bottom: 6px;
      border-bottom: 1px dashed var(--border-color);
    }

    .list-name {
      font-weight: bold;
      font-size: 1rem;
    }

    .list-dept {
      font-size: 0.75rem;
      background: #e2e8f0;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 4px;
    }

    .badge-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: flex-end;
    }

    .badge {
      font-size: 0.7rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 8px;
      white-space: nowrap;
    }

    .badge-approved {
      background-color: #dcfce7;
      color: #15803d;
    }

    .badge-pending {
      background-color: #fef3c7;
      color: #b45309;
    }

    .list-detail {
      font-size: 0.85rem;
      color: #334155;
      line-height: 1.4;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- 本人確認画面 -->
  <div id="authScreen" class="auth-screen">
    <h2>本人確認</h2>
    <p>Xác nhận / Authentication</p>
    
    <div class="auth-group">
      <label>社員ID <span style="font-weight:normal; color:#64748b;">(Mã số nhân viên)</span></label>
      <input type="text" id="empIdInput" class="auth-input" placeholder="例: 1001">
    </div>

    <div class="auth-group">
      <label>暗証番号 <span style="font-weight:normal; color:#64748b;">(月日4桁 例: 0912)</span></label>
      <input type="password" id="passInput" class="auth-input" maxlength="4" placeholder="••••">
    </div>

    <button onclick="checkAuth()" id="loginBtn" class="auth-btn">ログイン (Login)</button>
    <p id="passError" style="color: red; margin-top: 10px; display: none;"></p>
  </div>

  <!-- アプリ本体 -->
  <div id="mainApp" class="main-app">
    <div class="tab-menu">
      <button class="tab-btn active" onclick="switchTab('form')">勤怠送信 (Gửi)</button>
      <button class="tab-btn" onclick="switchTab('list')">連絡一覧 (Danh sách)</button>
    </div>

    <!-- フォーム画面 -->
    <div id="formTab">
      <div class="header">
        <h1>勤怠・連絡</h1>
        <p>Liên lạc nghỉ làm / Absence Notice</p>
      </div>

      <form id="attendanceForm">
        <div class="form-group">
          <label>1. お名前 <span class="sub">Họ và tên / Full Name</span></label>
          <input type="text" id="name" name="name" readonly style="background-color: #f1f5f9;" required>
        </div>

        <div class="form-group">
          <label>2. あなたの工程 <span class="sub">Công đoạn làm việc / Department</span></label>
          <select id="department" name="department" required>
            <option value="">-- 選んでください --</option>
            <option value="事務所">事務所 (Văn phòng)</option>
            <option value="検査">検査 (Kiểm tra)</option>
            <option value="ダイシング">ダイシング (Cắt)</option>
            <option value="密閉ボックス洗浄">密閉ボックス洗浄 (Rửa thùng kín khí)</option>
            <option value="スキャン">スキャン (Scan)</option>
          </select>
        </div>

        <div class="form-group">
          <label>3. 連絡の種類 <span class="sub">Loại liên lạc / Type</span></label>
          <div class="type-grid">
            <div class="type-card">
              <input type="radio" id="type1" name="type" value="有給" onchange="toggleDateInput('date')" required>
              <label for="type1">有給<span class="sub">Nghỉ phép</span></label>
            </div>
            <div class="type-card">
              <input type="radio" id="type2" name="type" value="半休" onchange="toggleDateInput('half')">
              <label for="type2">半休<span class="sub">Nghỉ nửa ngày</span></label>
            </div>
            <div class="type-card">
              <input type="radio" id="type3" name="type" value="欠勤" onchange="toggleDateInput('date')">
              <label for="type3">欠勤<span class="sub">Nghỉ không phép/ốm</span></label>
            </div>
            <div class="type-card">
              <input type="radio" id="type4" name="type" value="遅刻" onchange="toggleDateInput('datetime')">
              <label for="type4">遅刻<span class="sub">Đi muộn</span></label>
            </div>
            <div class="type-card">
              <input type="radio" id="type5" name="type" value="早退" onchange="toggleDateInput('datetime')">
              <label for="type5">早退<span class="sub">Về sớm</span></label>
            </div>
            <div class="type-card">
              <input type="radio" id="type6" name="type" value="中抜け" onchange="toggleDateInput('datetime')">
              <label for="type6">中抜け<span class="sub">Vắng mặt giữa giờ</span></label>
            </div>
          </div>
        </div>

        <div class="form-group" id="dateInputArea">
          <label>4. 日付・時間 <span class="sub">Ngày / Giờ (Date / Time)</span></label>

          <div id="singleDateBlock">
            <input type="date" id="targetDate" name="targetDate">
          </div>

          <div id="halfDateBlock" style="display: none;">
            <input type="date" id="halfDate" name="halfDate" style="margin-bottom: 8px;">
            <select id="halfAmpm" name="halfAmpm">
              <option value="午前 (Sáng / AM)">午前 (Sáng / AM)</option>
              <option value="午後 (Chiều / PM)">午後 (Chiều / PM)</option>
            </select>
          </div>

          <div id="dateTimeBlock" style="display: none;">
            <input type="datetime-local" id="targetDateTime" name="targetDateTime">
          </div>
        </div>

        <div class="form-group">
          <label>5. 理由 <span class="sub">Lý do / Reason</span></label>
          <div class="reason-grid">
            <div class="type-card">
              <input type="radio" id="reason1" name="reason" value="体調不良" onchange="toggleOtherReason(false)" required>
              <label for="reason1" style="text-align: left;">① 体調不良 <span class="sub">Sốt / Cảm / Ốm</span></label>
            </div>
            <div class="type-card">
              <input type="radio" id="reason2" name="reason" value="通院" onchange="toggleOtherReason(false)">
              <label for="reason2" style="text-align: left;">② 通院 <span class="sub">Đi bệnh viện</span></label>
            </div>
            <div class="type-card">
              <input type="radio" id="reason3" name="reason" value="私用" onchange="toggleOtherReason(false)">
              <label for="reason3" style="text-align: left;">③ 私用 <span class="sub">Việc riêng</span></label>
            </div>
            <div class="type-card">
              <input type="radio" id="reason4" name="reason" value="その他" onchange="toggleOtherReason(true)">
              <label for="reason4" style="text-align: left;">④ その他 <span class="sub">Khác (Other)</span></label>
            </div>
          </div>
          <div id="otherReasonBlock" style="display: none; margin-top: 8px;">
            <textarea id="otherReasonText" name="otherReasonText" rows="2" placeholder="理由を入力してください / Nhập lý do"></textarea>
          </div>
        </div>

        <button type="submit" class="submit-btn">送信する (Gửi)</button>
      </form>

      <div id="successMessage" class="success-msg">
        <h2 style="color: var(--accent-color);">送信完了！</h2>
        <p>Đã gửi thành công!</p>
        <p style="margin-top: 10px; font-size: 0.85rem; color: #64748b;">管理者に通知されました。</p>
        <button onclick="resetForm()" class="submit-btn" style="margin-top: 15px; background: #64748b;">もう一度入力する</button>
      </div>
    </div>

    <!-- 連絡一覧画面 -->
    <div id="listTab" style="display: none;">
      <div class="header">
        <h1>連絡一覧・承認状況</h1>
        <p>Danh sách & Trạng thái duyệt</p>
      </div>

      <div class="filter-box">
        <div class="filter-row">
          <input type="date" id="filterDate" onchange="filterList()">
          <select id="filterDept" onchange="filterList()">
            <option value="">すべての工程</option>
            <option value="事務所">事務所</option>
            <option value="検査">検査</option>
            <option value="ダイシング">ダイシング</option>
            <option value="密閉ボックス洗浄">密閉ボックス洗浄</option>
            <option value="スキャン">スキャン</option>
          </select>
        </div>
        <button onclick="clearFilter()" style="width: 100%; padding: 6px; font-size: 0.8rem; background: #cbd5e1; border: none; border-radius: 4px; cursor: pointer;">検索クリア (Xóa lọc)</button>
      </div>

      <div id="recordsContainer">
        <p style="text-align: center; color: #64748b; padding: 20px;">読み込み中... (Đang tải...)</p>
      </div>
    </div>

  </div>
</div>

<script>
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzoPPh09ulUocdfRIKbW3ZqlIAo8pAPa2D5-bDkpUJpJbCvCWyGHAhlytXveK-pz2b7EQ/exec";

  let allRecords = [];

  document.getElementById('targetDate').valueAsDate = new Date();
  document.getElementById('halfDate').valueAsDate = new Date();

  function checkAuth() {
    const empId = document.getElementById('empIdInput').value.trim();
    const dob = document.getElementById('passInput').value.trim();
    const errEl = document.getElementById('passError');
    const loginBtn = document.getElementById('loginBtn');

    if (!empId || !dob) {
      errEl.innerText = "IDと暗証番号（月日）を入力してください";
      errEl.style.display = 'block';
      return;
    }

    loginBtn.disabled = true;
    loginBtn.innerText = "確認中...";
    errEl.style.display = 'none';

    fetch(`${GAS_WEB_APP_URL}?action=authenticate&empId=${encodeURIComponent(empId)}&dob=${encodeURIComponent(dob)}`)
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        document.getElementById('name').value = data.userName;
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
      } else {
        errEl.innerText = "IDまたは暗証番号（月日）が違います";
        errEl.style.display = 'block';
        loginBtn.disabled = false;
        loginBtn.innerText = "ログイン (Login)";
      }
    })
    .catch(err => {
      errEl.innerText = "通信エラーが発生しました";
      errEl.style.display = 'block';
      loginBtn.disabled = false;
      loginBtn.innerText = "ログイン (Login)";
    });
  }

  function switchTab(tab) {
    const formTab = document.getElementById('formTab');
    const listTab = document.getElementById('listTab');
    const btns = document.querySelectorAll('.tab-btn');

    if (tab === 'form') {
      formTab.style.display = 'block';
      listTab.style.display = 'none';
      btns[0].classList.add('active');
      btns[1].classList.remove('active');
    } else {
      formTab.style.display = 'none';
      listTab.style.display = 'block';
      btns[0].classList.remove('active');
      btns[1].classList.add('active');
      fetchRecords();
    }
  }

  function toggleDateInput(mode) {
    document.getElementById('singleDateBlock').style.display = (mode === 'date') ? 'block' : 'none';
    document.getElementById('halfDateBlock').style.display = (mode === 'half') ? 'block' : 'none';
    document.getElementById('dateTimeBlock').style.display = (mode === 'datetime') ? 'block' : 'none';
  }

  function toggleOtherReason(isOther) {
    document.getElementById('otherReasonBlock').style.display = isOther ? 'block' : 'none';
    if (!isOther) {
      document.getElementById('otherReasonText').value = '';
    }
  }

  document.getElementById('attendanceForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const submitBtn = document.querySelector('.submit-btn');
    submitBtn.innerText = "送信中... (Đang gửi)";
    submitBtn.disabled = true;

    const name = document.getElementById('name').value;
    const department = document.getElementById('department').value;
    const type = document.querySelector('input[name="type"]:checked')?.value || '';
    
    let datetime = '';
    if (type === '有給' || type === '欠勤') {
      datetime = document.getElementById('targetDate').value;
    } else if (type === '半休') {
      const hDate = document.getElementById('halfDate').value;
      const hAmpm = document.getElementById('halfAmpm').value;
      datetime = `${hDate} ${hAmpm}`;
    } else {
      const rawDt = document.getElementById('targetDateTime').value;
      datetime = rawDt.replace('T', ' ');
    }

    let reason = document.querySelector('input[name="reason"]:checked')?.value || '';
    if (reason === 'その他') {
      const otherDetail = document.getElementById('otherReasonText').value;
      reason = otherDetail ? `その他: ${otherDetail}` : 'その他';
    }

    const payload = new URLSearchParams();
    payload.append('name', name);
    payload.append('department', department);
    payload.append('type', type);
    payload.append('datetime', datetime);
    payload.append('reason', reason);

    fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded',
      },
      body: payload.toString()
    })
    .then(response => {
      document.getElementById('attendanceForm').style.display = 'none';
      document.getElementById('successMessage').style.display = 'block';
    })
    .catch(error => {
      alert("送信に失敗しました。");
      submitBtn.innerText = "送信する (Gửi)";
      submitBtn.disabled = false;
    });
  });

  function resetForm() {
    document.getElementById('attendanceForm').reset();
    document.getElementById('attendanceForm').style.display = 'block';
    document.getElementById('successMessage').style.display = 'none';
    document.querySelector('.submit-btn').innerText = "送信する (Gửi)";
    document.querySelector('.submit-btn').disabled = false;
    toggleDateInput('date');
    toggleOtherReason(false);
  }

  function fetchRecords() {
    const container = document.getElementById('recordsContainer');
    container.innerHTML = '<p style="text-align: center; color: #64748b; padding: 20px;">読み込み中... (Đang tải...)</p>';

    fetch(GAS_WEB_APP_URL + "?action=getRecords")
    .then(res => res.json())
    .then(data => {
      allRecords = data;
      // 初回表示は直近30件のみ表示して軽量化する
      const recentRecords = allRecords.slice(0, 30);
      renderRecords(recentRecords);
    })
    .catch(err => {
      container.innerHTML = '<p style="text-align: center; color: red;">データの取得に失敗しました。</p>';
    });
  }

  // 二重ステータス描画処理
  function renderRecords(records) {
    const container = document.getElementById('recordsContainer');
    if (!records || records.length === 0) {
      container.innerHTML = '<p style="text-align: center; color: #64748b; padding: 20px;">データがありません。</p>';
      return;
    }

    let html = '';
    records.forEach(r => {
      const isMgrApproved = r.managerStatus === "承認済" || r.managerStatus === "Approved";
      const isFacApproved = r.factoryStatus === "承認済" || r.factoryStatus === "Approved";

      const mgrBadgeClass = isMgrApproved ? 'badge-approved' : 'badge-pending';
      const facBadgeClass = isFacApproved ? 'badge-approved' : 'badge-pending';

      const mgrText = isMgrApproved ? '責任者: 承認済' : '責任者: 未承認';
      const facText = isFacApproved ? '工場長: 承認済' : '工場長: 未承認';

      html += `
        <div class="list-card">
          <div class="list-header">
            <span class="list-name">${r.name} <span class="list-dept">${r.department}</span></span>
            <div class="badge-group">
              <span class="badge ${mgrBadgeClass}">${mgrText}</span>
              <span class="badge ${facBadgeClass}">${facText}</span>
            </div>
          </div>
          <div class="list-detail">
            <strong>【${r.type}】</strong> ${r.datetime}<br>
            <strong>理由:</strong> ${r.reason}
          </div>
        </div>
      `;
    });
    container.innerHTML = html;
  }

  function filterList() {
    const selectedDate = document.getElementById('filterDate').value;
    const selectedDept = document.getElementById('filterDept').value;

    const filtered = allRecords.filter(r => {
      let matchDate = true;
      if (selectedDate && r.datetime) {
        const formattedTargetDate = r.datetime.replace(/\//g, '-');
        matchDate = formattedTargetDate.includes(selectedDate);
      }

      const matchDept = !selectedDept || r.department === selectedDept;
      return matchDate && matchDept;
    });

    renderRecords(filtered);
  }

  function clearFilter() {
    document.getElementById('filterDate').value = '';
    document.getElementById('filterDept').value = '';
    // クリア時も直近30件のみ表示する
    renderRecords(allRecords.slice(0, 30));
  }
</script>

</body>
</html>
